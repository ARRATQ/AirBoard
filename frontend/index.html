<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/airboard-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airboard - Portail Applicatif</title>
    <meta name="description" content="Portail applicatif moderne avec gestion des accès par groupes" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- IBM Plex Sans et IBM Plex Mono : direction A+ (IBM Plex Sans Arabic est ajoutée pour l'arabe, voir i18n/index.js) -->

    <!-- Meta tags pour PWA (optionnel) -->
    <meta name="theme-color" content="#15181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
